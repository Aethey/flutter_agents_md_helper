name: flutter_agents_md_helper
description: Build a coherent Flutter architecture and export FLUTTER_ARCHITECTURE.md for coding agents.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^18.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  riverpod_generator: ^3.0.3
  go_router_builder: ^4.1.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - knowledge/index.json
    - knowledge/flow/
    - knowledge/requirements/
    - knowledge/structure/
    - knowledge/architecture/
    - knowledge/state/
    - knowledge/routing/
    - knowledge/networking/
    - knowledge/models/
    - knowledge/persistence/
    - knowledge/native/
    - knowledge/testing/
    - knowledge/analysis/
    - knowledge/monitoring/
