<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Build a Flutter architecture before you write the app, then export FLUTTER_ARCHITECTURE.md for coding agents.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter Architect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <title>Flutter Architect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light dark;
      --loader-bg: #f5f5f3;
      --loader-fg: #171717;
      --loader-muted: #777773;
      --loader-line: #d8d8d3;
      --loader-node: #9a9a94;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --loader-bg: #151515;
        --loader-fg: #f1f1ee;
        --loader-muted: #9a9a94;
        --loader-line: #353533;
        --loader-node: #b5b5ae;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--loader-bg);
    }

    body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--loader-bg);
      color: var(--loader-fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter,
        system-ui, sans-serif;
      opacity: 1;
      transition: opacity 240ms ease;
    }

    #app-loader.is-complete {
      pointer-events: none;
      opacity: 0;
    }

    .loader-content {
      display: flex;
      width: min(280px, calc(100vw - 48px));
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .loader-mark {
      width: 72px;
      height: 56px;
      margin-bottom: 24px;
    }

    .loader-mark path {
      fill: none;
      stroke: var(--loader-line);
      stroke-linecap: round;
      stroke-width: 1.5;
    }

    .loader-mark rect {
      fill: var(--loader-bg);
      stroke: var(--loader-node);
      stroke-width: 1.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: loader-node 1.8s ease-in-out infinite;
    }

    .loader-mark rect:nth-of-type(2) {
      animation-delay: 180ms;
    }

    .loader-mark rect:nth-of-type(3) {
      animation-delay: 360ms;
    }

    .loader-title {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .loader-status {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--loader-muted);
      font-size: 13px;
      letter-spacing: -0.005em;
    }

    @keyframes loader-node {
      0%,
      100% {
        opacity: 0.38;
        transform: scale(0.86);
      }
      45% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader {
        transition: none;
      }

      .loader-mark rect {
        animation: none;
        opacity: 0.78;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="loader-content">
      <svg class="loader-mark" viewBox="0 0 72 56" aria-hidden="true">
        <path d="M16 16h20v24h20M36 16v24" />
        <rect x="10" y="10" width="12" height="12" rx="3" />
        <rect x="30" y="34" width="12" height="12" rx="3" />
        <rect x="50" y="34" width="12" height="12" rx="3" />
      </svg>
      <p class="loader-title">Flutter Architect</p>
      <p class="loader-status" id="app-loader-status">Preparing your workspace…</p>
    </div>
  </div>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
