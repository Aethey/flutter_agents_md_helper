<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flutter Architect</title>
  <style>
    /* ─── tokens ─────────────────────────────────────────────────────────
       Dark default: Flutter brand charcoal + primary blue.
       Light: modern-minimal foundation with the same Flutter accent. */
    :root {
      --bg:      oklch(16% 0.006 271);
      --surface: oklch(21% 0.006 271);
      --fg:      oklch(93% 0.005 258);
      --muted:   oklch(72% 0.012 262);
      --border:  oklch(30% 0.008 271);
      --accent:  oklch(54.91% 0.1475 248.0); /* Flutter primary blue */

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: clamp(28px, 2.6vw, 40px);
      --fs-h2: clamp(22px, 2vw, 28px);
      --fs-h3: 17px;
      --fs-lead: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --container: 1120px;
      --gutter: 32px;

      --radius: 12px;
      --radius-lg: 20px;
      --nav-h: 56px;
    }
    :root[data-theme="light"] {
      --bg:      oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(18% 0.012 250);
      --muted:   oklch(46% 0.012 250);
      --border:  oklch(92% 0.005 250);
      --accent:  oklch(54.91% 0.1475 248.0);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; color: inherit; background: none; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .section { padding-block: clamp(48px, 8vw, var(--gap-2xl)); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }

    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.15; letter-spacing: -0.02em; margin: 0; font-weight: 600; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.2; letter-spacing: -0.015em; margin: 0; font-weight: 600; }
    .h3, h3 { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 var(--gap-sm);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .topnav {
      position: sticky; top: 0; z-index: 10;
      height: var(--nav-h);
      background: color-mix(in oklch, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 100%; gap: var(--gap-md);
    }
    .topnav .logo { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .topnav nav { display: flex; gap: 4px; align-items: center; }
    .topnav nav a { font-size: 13px; color: var(--muted); }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 18px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 14px; font-weight: 550; letter-spacing: -0.005em;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--accent);
      color: color-mix(in oklch, var(--bg) 8%, white);
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: color-mix(in oklch, var(--accent) 82%, var(--fg));
      color: color-mix(in oklch, var(--bg) 8%, white);
    }
    .btn-primary:disabled {
      opacity: 0.38; cursor: not-allowed; transform: none;
    }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { background: var(--fg-soft); border-color: color-mix(in oklch, var(--fg) 28%, var(--border)); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 12px; }
    .btn-ghost:hover { background: var(--fg-soft); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }
    .btn:focus-visible, .icon-btn:focus-visible, a:focus-visible, .option-card:focus-visible, .lang-menu button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }
    .card-flat { background: transparent; border: 0; padding: 0; }
    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }

    .feature .feature-mark {
      width: 36px; height: 36px; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--fg); margin-bottom: var(--gap-md);
    }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p  { margin: 0; color: var(--muted); font-size: 15px; }

    .stat .stat-num { font-family: var(--font-display); font-size: clamp(56px, 8vw, 96px); line-height: 0.95; letter-spacing: -0.04em; color: var(--accent); font-weight: 600; }
    .stat .stat-label { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 24ch; }
    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }
    .quote { font-family: var(--font-display); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.32; letter-spacing: -0.01em; max-width: 28ch; }
    .quote-author { color: var(--muted); font-size: 14px; margin-top: var(--gap-md); }
    .quote-mark { font-family: var(--font-display); font-size: 140px; line-height: 0.7; color: var(--accent); opacity: 0.18; margin-bottom: -28px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; background: var(--fg-soft); color: var(--fg);
      border-radius: 999px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 4px 10px; background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; font-size: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .input, .textarea {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); color: var(--fg); font: inherit; font-size: 15px;
    }
    .input:focus, .textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }

    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    .ph-img {
      background: linear-gradient(135deg, var(--accent-soft), var(--fg-soft)), var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      aspect-ratio: 16 / 10; display: grid; place-items: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    }
    .ph-img.square { aspect-ratio: 1 / 1; }
    .ph-img.portrait { aspect-ratio: 3 / 4; }
    .ph-img.wide { aspect-ratio: 16 / 9; }
    .content-img {
      display: block; max-width: 100%; max-height: min(70vh, 720px);
      width: auto; height: auto; object-fit: contain; justify-self: center; border-radius: var(--radius-lg);
    }
    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }
    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }
    .hero { padding-block: clamp(80px, 12vw, 160px); }
    .hero-center { text-align: center; max-width: 32ch; margin-inline: auto; }
    .hero h1 { margin-bottom: var(--gap-md); }
    .hero .lead { margin-bottom: var(--gap-lg); }
    .hero-cta { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }
    .hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    /* ─── app shell ─────────────────────────────────────────────────── */
    .app-shell { display: flex; flex-direction: column; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 28px; height: 28px; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: 8px;
      display: grid; place-items: center; color: var(--fg);
    }
    .brand-copy { display: flex; flex-direction: column; min-width: 0; }
    .brand-copy .logo-sub {
      font-size: 11px; color: var(--muted); font-weight: 400;
      letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 42ch;
    }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 10px; border: 1px solid transparent; color: var(--fg);
    }
    .icon-btn:hover, .icon-btn.is-active { background: var(--fg-soft); color: var(--fg); }
    .icon-btn svg { width: 16px; height: 16px; }
    .nav-divider {
      width: 1px; height: 16px; margin: 0 6px;
      background: var(--border); flex-shrink: 0;
    }
    .lang-wrap { position: relative; }
    .lang-menu {
      position: absolute; right: 0; top: calc(100% + 8px);
      min-width: 168px; padding: 6px;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 12px 32px color-mix(in oklch, var(--bg) 55%, transparent);
      z-index: 20;
    }
    .lang-menu[hidden] { display: none; }
    .lang-menu button {
      width: 100%; min-height: 44px; padding: 0 10px;
      border-radius: 8px; border: 0; background: transparent;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--fg); text-align: left;
    }
    .lang-menu button:hover { background: var(--fg-soft); color: var(--fg); }
    .lang-menu button.is-current { font-weight: 600; }

    .workspace {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 23% minmax(0, 1fr) 30%;
    }
    .panel {
      min-height: 0; overflow: auto;
      display: flex; flex-direction: column;
    }
    .panel-left { border-right: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 70%, var(--surface)); }
    .panel-center { padding: 36px 44px 28px; }
    .panel-right { border-left: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 55%, var(--bg)); }
    .panel-body { padding: 22px 20px 16px; flex: 1; }
    .panel-foot { padding: 16px 20px 20px; border-top: 1px solid var(--border); }

    .progress-track {
      height: 3px; border-radius: 999px; background: var(--fg-soft); overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0; border-radius: inherit;
      background: var(--fg); transition: width 0.25s ease;
    }

    .tree { display: flex; flex-direction: column; gap: 2px; }
    .tree-root {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-weight: 600; font-size: 13px;
      padding: 6px 0 14px;
    }
    .tree-cat {
      display: grid; grid-template-columns: 28px 1fr 44px; gap: 8px;
      align-items: start; padding: 10px 8px; border-radius: 12px;
      opacity: 0.4; transition: opacity 0.15s ease, background 0.15s ease;
    }
    .tree-cat.is-done { opacity: 1; }
    .tree-cat.is-current { opacity: 1; background: var(--fg-soft); }
    .tree-cat.is-done .tree-tech { background: var(--accent-soft); }
    .tree-mark {
      width: 28px; height: 28px; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 8px; color: var(--fg);
    }
    .tree-mark svg { width: 14px; height: 14px; }
    .tree-label { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
    .tree-tech {
      display: inline-block; margin-top: 3px; padding: 2px 8px;
      border-radius: 999px; font-size: 13px; font-weight: 550;
    }
    .tree-sub {
      margin: 4px 0 0 8px; padding-left: 10px;
      border-left: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    }
    .tree-edit {
      width: 44px; height: 44px; margin-top: -6px; border-radius: 8px;
      display: grid; place-items: center; color: var(--muted); opacity: 0;
    }
    .tree-cat:hover .tree-edit, .tree-edit:focus-visible { opacity: 1; color: var(--fg); }
    .tree-edit:hover { background: var(--fg-soft); }

    .option-list {
      display: flex; flex-direction: column; gap: 12px; margin-top: 28px;
    }
    .option-list.is-multi {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }
    .option-list.is-multi[data-count="3"] {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .option-card {
      text-align: left; width: 100%;
      display: flex; flex-direction: column; align-items: stretch;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px 24px;
      box-shadow: 0 1px 0 color-mix(in oklch, var(--fg) 5%, transparent);
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .option-card:hover, .option-card.is-preview {
      border-color: color-mix(in oklch, var(--fg) 32%, var(--border));
      background: color-mix(in oklch, var(--fg) 4%, var(--surface));
    }
    .option-card.is-selected {
      border-color: var(--accent);
      background: color-mix(in oklch, var(--accent) 10%, var(--surface));
    }
    .option-card.is-selected:hover, .option-card.is-selected.is-preview {
      border-color: var(--accent);
      background: color-mix(in oklch, var(--accent) 14%, var(--surface));
    }
    .option-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 8px;
    }
    .option-head h3 { min-width: 0; overflow-wrap: break-word; }
    .option-head .tag { flex-shrink: 0; }
    .option-card p { margin: 0; color: var(--muted); font-size: 14px; max-width: 52ch; }
    .option-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .option-list.is-multi .option-card { height: 100%; padding: 18px 18px; }
    .option-list.is-multi .option-card p { max-width: none; flex: 1; }
    .option-list.is-multi .option-tags { margin-top: auto; padding-top: 12px; }
    .option-list.is-dense { gap: 10px; margin-top: 20px; }
    .option-list.is-dense .option-card { padding: 16px 16px; }
    .option-list.is-dense .option-card p { font-size: 13px; }

    .decision-foot {
      margin-top: auto; padding-top: 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .decision-actions { display: flex; align-items: center; gap: 8px; }

    .insight { padding: 28px 24px 32px; }
    .insight-kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .insight h2 { font-size: 26px; margin: 4px 0 6px; }
    .insight-docs {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px; margin: 0 0 2px; padding: 0 2px;
      font-size: 13px; color: var(--fg);
      border-bottom: 1px solid color-mix(in oklch, var(--fg) 28%, var(--border));
      width: fit-content;
    }
    .insight-docs:hover {
      text-decoration: none;
      background: var(--fg-soft);
      border-bottom-color: var(--fg);
      color: var(--fg);
    }
    .insight-docs svg { width: 13px; height: 13px; flex-shrink: 0; }
    .insight-desc { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .insight h3 { font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
    .insight-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .insight-list li { font-size: 14px; padding-left: 18px; position: relative; }
    .insight-list.pros li::before { content: '✓'; position: absolute; left: 0; color: var(--fg); font-size: 12px; }
    .insight-list.cons li::before { content: '–'; position: absolute; left: 0; color: var(--muted); }
    .works-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .review-wrap { height: 100%; overflow: auto; padding: 40px 48px 64px; }
    .review-wrap .lead { margin: 10px 0 32px; }
    .review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .review-card h3 { margin-bottom: 10px; }
    .review-tech { font-size: 14px; font-weight: 550; margin: 0 0 4px; }
    .review-reason { margin: 0; color: var(--muted); font-size: 13px; }
    .review-cta { margin-top: 40px; text-align: center; }
    .review-cta .lead { margin: 0 auto 20px; }
    .text-action { display: inline-block; margin-top: 16px; font-size: 13px; color: var(--muted); min-height: 44px; padding: 12px; }
    .text-action:hover { color: var(--fg); }

    .screen { display: none; height: 100%; min-height: 0; }
    .screen.is-on { display: flex; flex-direction: column; }

    dialog.card {
      width: min(720px, calc(100vw - 32px));
      max-height: min(80vh, 840px);
      padding: 0; border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
    }
    dialog::backdrop { background: color-mix(in oklch, var(--bg) 72%, black); }
    .dialog-head { padding: 20px 22px 0; }
    .dialog-body { padding: 16px 22px 22px; overflow: auto; max-height: 60vh; }
    .agents-out {
      margin: 0; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg); color: var(--fg);
      font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap;
    }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 26% minmax(0,1fr) 32%; }
      .panel-center { padding: 28px 24px; }
      .brand-copy .logo-sub { display: none; }
      .review-grid { grid-template-columns: 1fr 1fr; }
      .option-list.is-multi[data-count="3"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 920px) {
      body { overflow: auto; }
      .app-shell { height: auto; min-height: 100vh; }
      .workspace { display: flex; flex-direction: column; height: auto; }
      .panel { overflow: visible; }
      .panel-center { order: -1; }

        back: '返回', skip: '跳过', continue: '继续',
        reviewEyebrow: '最终确认', reviewTitle: '你的 Flutter 架构',
        reviewLead: '生成项目说明前，请先核对全部决定。',
        reviewCtaTitle: '按此架构写出 AGENTS.md',
        reviewCtaLead: '把决定转换成给实现代理用的项目说明。',
        generate: '生成 AGENTS.md', backDecisions: '返回决定', restart: '从头开始',
        copy: '复制', copied: '已复制', copySelect: '请选择后复制', close: '关闭',
        undecided: '未决定', recommended: '推荐', preview: '预览',
        pros: '优点', cons: '取舍', when: '适合的情况',
        avoid: '应避免的情况', with: '搭配良好',
        docs: '官方文档', docsAria: '打开 {name} 的官方页面',
        edit: '编辑', editNamed: '编辑{name}',
        reviewPending: '这一项还没有选择。',
        'group-structure': '项目', 'group-architecture': '架构',
        'group-state': '状态', 'group-routing': '路由',
        'group-network': '网络', 'group-models': '模型',
        'group-native': '原生通信', 'group-monitor': '监控',
        agentsIntro: '本仓库的 Flutter 架构遵循 Flutter Architect 中的决定。',
        agentsReason: '原因', agentsWith: '搭配', agentsRules: '实现约定',
        agentsRule1: '新功能不得破坏已选边界。',
        agentsRule2: '依赖方向由外（UI / 基础设施）指向内（领域 / 功能）。',
        agentsRule3: '不要手改生成代码。'
      }
    };
    const LANG_ATTR = { ja: 'ja', en: 'en', zh: 'zh-CN' };
    const GROUPS = [
      { id: 'structure', title: 'プロジェクト', icon: 'structure', decisionIds: ['project-structure', 'workspace'] },
      { id: 'architecture', title: 'アーキテクチャ', icon: 'architecture', decisionIds: ['architecture'] },
      { id: 'state', title: '状態', icon: 'state', decisionIds: ['state'] },
      { id: 'routing', title: 'ルーティング', icon: 'routing', decisionIds: ['routing', 'typed-routing'] },
      { id: 'network', title: '通信', icon: 'network', decisionIds: ['networking', 'api-client'] },
      { id: 'models', title: 'モデル', icon: 'models', decisionIds: ['models', 'serialization'] },
      { id: 'native', title: 'ネイティブ連携', icon: 'native', decisionIds: ['native'] },
      { id: 'monitor', title: '監視', icon: 'monitor', decisionIds: ['monitoring'] }
    ];

    const OFFICIAL_DOCS = {
      'single-package': 'https://docs.flutter.dev/resources/architectural-overview',
      'multi-package': 'https://dart.dev/tools/pub/create-packages',
      'dart-workspace': 'https://dart.dev/tools/pub/workspaces',
      'melos': 'https://melos.invertase.dev/',
      'simple-layers': 'https://docs.flutter.dev/app-architecture',
      'feature-first': 'https://docs.flutter.dev/app-architecture/recommendations',
      'clean': 'https://docs.flutter.dev/app-architecture/guide',
      'setstate': 'https://api.flutter.dev/flutter/widgets/State/setState.html',
      'provider': 'https://pub.dev/packages/provider',
      'riverpod': 'https://riverpod.dev/',
      'bloc': 'https://bloclibrary.dev/',
      'navigator': 'https://docs.flutter.dev/ui/navigation',
      'go-router': 'https://pub.dev/packages/go_router',
      'manual-routes': 'https://docs.flutter.dev/ui/navigation',
      'go-router-builder': 'https://pub.dev/packages/go_router_builder',
      'http': 'https://pub.dev/packages/http',
      'dio': 'https://pub.dev/packages/dio',
      'manual-api': 'https://docs.flutter.dev/cookbook/networking/fetch-data',
      'retrofit': 'https://pub.dev/packages/retrofit',
      'openapi': 'https://openapi-generator.tech/docs/generators/dart-dio/',
      'plain-dart': 'https://dart.dev/language/classes',
      'freezed': 'https://pub.dev/packages/freezed',
      'manual-json': 'https://docs.flutter.dev/data-and-backend/serialization/json',
      'json-serializable': 'https://pub.dev/packages/json_serializable',
      'method-channel': 'https://docs.flutter.dev/platform-integration/platform-channels',
      'pigeon': 'https://pub.dev/packages/pigeon',
      'crashlytics': 'https://firebase.google.com/docs/crashlytics/get-started?platform=flutter',
      'sentry': 'https://docs.sentry.io/platforms/flutter/'
    };

    const state = {
      step: 4,
      answers: {
        'project-structure': 'multi-package',
        workspace: 'melos',
        architecture: 'feature-first',
        state: 'riverpod'
      },
      selected: null,
      preview: null,
      view: 'wizard',
      locale: 'ja'
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.answers) state.answers = saved.answers;
        if (typeof saved.step === 'number') state.step = saved.step;
        if (saved.view) state.view = saved.view;
        if (saved.locale && UI[saved.locale]) state.locale = saved.locale;
        if (saved.theme) document.documentElement.setAttribute('data-theme', saved.theme);
      } catch (err) { /* ignore broken local state */ }
    }

    function persist() {
      localStorage.setItem(STORE, JSON.stringify({
        answers: state.answers,
        step: state.step,
        view: state.view,
        locale: state.locale,
        theme: document.documentElement.getAttribute('data-theme') || 'dark'
      }));
    }

    function decision() { return DECISIONS[state.step]; }
    function optionById(dec, id) { return dec.options.find((o) => o.id === id); }
    function currentOption() {
      const dec = decision();
      const id = state.preview || state.selected || state.answers[dec.id];
      return optionById(dec, id) || dec.options[0];
    }

    function iconSvg(name) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">' + (ICONS[name] || ICONS.structure) + '</svg>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function t(key, vars) {
      const table = UI[state.locale] || UI.ja;
      let s = table[key] || UI.ja[key] || key;
      if (vars) Object.keys(vars).forEach((k) => { s = s.replace('{' + k + '}', vars[k]); });
      return s;
    }

    function groupTitle(group) { return t('group-' + group.id); }

    function setLangMenu(open) {
      const menu = document.getElementById('lang-menu');
      const btn = document.getElementById('btn-lang');
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.classList.toggle('is-active', open);
    }

    function applyChrome() {
      document.documentElement.lang = LANG_ATTR[state.locale] || 'ja';
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
        const label = t(el.getAttribute('data-i18n-aria'));
        el.setAttribute('aria-label', label);
        if (el.classList.contains('icon-btn')) el.setAttribute('title', label);
      });
      document.querySelectorAll('[data-lang]').forEach((btn) => {
        btn.classList.toggle('is-current', btn.getAttribute('data-lang') === state.locale);
      });
    }

    function renderTree() {
      const root = document.getElementById('arch-tree');
      const current = decision();
      let html = '<div class="tree-root"><span class="tree-mark">' + iconSvg('architecture') + '</span>Flutter</div>';
      GROUPS.forEach((group) => {
        const parts = group.decisionIds.map((id) => {
          const dec = DECISIONS.find((d) => d.id === id);
          const opt = optionById(dec, state.answers[id]);
          return { dec, opt };
        });
        const done = parts.some((p) => p.opt);
        const isCurrent = group.decisionIds.includes(current.id);
        const primary = parts[0].opt;
        const secondary = parts.slice(1).map((p) => p.opt).filter(Boolean);
        const implied = primary && primary.implies && !secondary.length ? primary.implies : null;
        const jumpId = parts.find((p) => p.opt)?.dec.id || group.decisionIds[0];
        html += '<div class="tree-cat' + (done ? ' is-done' : '') + (isCurrent ? ' is-current' : '') + '">';
        html += '<span class="tree-mark">' + iconSvg(group.icon) + '</span>';
        html += '<div><div class="tree-label">' + escapeHtml(groupTitle(group)) + '</div>';
        html += '<div class="tree-tech">' + escapeHtml(primary ? primary.name : t('undecided')) + '</div>';
        secondary.forEach((opt) => { html += '<div class="tree-sub">' + escapeHtml(opt.name) + '</div>'; });
        if (implied) html += '<div class="tree-sub">' + escapeHtml(implied) + '</div>';
        html += '</div>';
        html += '<button class="tree-edit" type="button" data-jump="' + jumpId + '" aria-label="' + escapeHtml(t('editNamed', { name: groupTitle(group) })) + '">';
        html += '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button></div>';
      });
      root.innerHTML = html;
      root.querySelectorAll('[data-jump]').forEach((btn) => {
        btn.addEventListener('click', () => jumpTo(btn.getAttribute('data-jump')));
      });
    }

    function renderProgress() {
      const done = Object.keys(state.answers).length;
      document.getElementById('progress-label').textContent = t('progress', { done: done });
      document.getElementById('progress-bar').setAttribute('aria-valuenow', String(done));
      document.getElementById('progress-fill').style.width = (done / 12 * 100) + '%';
    }

    function renderDecision() {
      const dec = decision();
      state.selected = state.answers[dec.id] || null;
      const recommended = dec.options.find((o) => o.recommended);
      state.preview = state.selected || (recommended && recommended.id) || dec.options[0].id;
      document.getElementById('decision-crumb').textContent = dec.crumb;
      document.getElementById('decision-title').textContent = dec.question;
      document.getElementById('decision-blurb').textContent = dec.blurb;
      document.getElementById('decision-index').textContent = t('decisionIndex', { n: state.step + 1 });
      document.getElementById('btn-back').disabled = state.step === 0;
      renderOptions();
      renderInsight();
      document.getElementById('btn-continue').disabled = !state.selected;
    }

    function optionColumns(count) {
      if (count <= 2) return 1;
      if (window.matchMedia('(max-width: 920px)').matches) return 1;
      if (count === 3 && window.matchMedia('(min-width: 1101px)').matches) return 3;
      return 2;
    }

    function moveOptionIndex(ids, idx, cols, dir) {
      const n = ids.length;
      const col = idx % cols;
      if (dir === 'right') return (idx + 1 < n && col + 1 < cols) ? idx + 1 : idx;
      if (dir === 'left') return col > 0 ? idx - 1 : idx;
      if (dir === 'down') {
        const target = idx + cols;
        if (target < n) return target;
        return idx < n - 1 ? n - 1 : idx;
      }
      if (dir === 'up') {
        const target = idx - cols;
        return target >= 0 ? target : idx;
      }
      return idx;
    }

    function renderOptions() {
      const dec = decision();
      const list = document.getElementById('option-list');
      const count = dec.options.length;
      list.dataset.count = String(count);
      list.classList.toggle('is-multi', count > 2);
      list.classList.toggle('is-dense', count >= 3);
      list.innerHTML = dec.options.map((opt) => {
        const selected = state.selected === opt.id;
        const preview = state.preview === opt.id;
        return '<button class="option-card' + (selected ? ' is-selected' : '') + (preview ? ' is-preview' : '') + '" role="option" aria-selected="' + selected + '" data-opt="' + opt.id + '" data-od-id="option-' + opt.id + '" type="button">' +
          '<div class="option-head"><h3>' + escapeHtml(opt.name) + '</h3>' +
          (opt.recommended ? '<span class="tag">' + escapeHtml(t('recommended')) + '</span>' : '') + '</div>' +
          '<p>' + escapeHtml(opt.summary) + '</p>' +
          '<div class="option-tags">' + opt.tags.map((t) => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</div></button>';
      }).join('');
      list.querySelectorAll('.option-card').forEach((card) => {
        const id = card.getAttribute('data-opt');
        card.addEventListener('mouseenter', () => { state.preview = id; syncPreview(); });
        card.addEventListener('focus', () => { state.preview = id; syncPreview(); });
        card.addEventListener('click', () => selectOption(id));
      });
    }

    function syncPreview() {
      document.querySelectorAll('.option-card').forEach((card) => {
        card.classList.toggle('is-preview', card.getAttribute('data-opt') === state.preview);
      });
      renderInsight();
    }

    function selectOption(id) {
      state.selected = id;
      state.preview = id;
      document.querySelectorAll('.option-card').forEach((card) => {
        const on = card.getAttribute('data-opt') === id;
        card.classList.toggle('is-selected', on);
        card.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.getElementById('btn-continue').disabled = false;
      renderInsight();
    }

    function renderInsight() {
      const opt = currentOption();
      const ins = opt.insight;
      const previewing = state.preview && state.preview !== state.selected;
      const docsUrl = OFFICIAL_DOCS[opt.id];
      const docsLink = docsUrl
        ? '<a class="insight-docs" data-od-id="insight-docs" href="' + escapeHtml(docsUrl) + '" target="_blank" rel="noreferrer" aria-label="' + escapeHtml(t('docsAria', { name: opt.name })) + '">' +
          escapeHtml(t('docs')) +
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3.5h6.5V10M12.5 3.5 6 10"/><path d="M9 3.5H4.2A1.2 1.2 0 0 0 3 4.7v7.1A1.2 1.2 0 0 0 4.2 13h7.1A1.2 1.2 0 0 0 12.5 11.8V8"/></svg></a>'
        : '';
      document.getElementById('insight').innerHTML =
        '<div class="insight-kicker"><p class="eyebrow" style="margin:0">' + escapeHtml(ins.label) + '</p>' +
        (previewing ? '<span class="pill">' + escapeHtml(t('preview')) + '</span>' : '') + '</div>' +
        '<h2>' + escapeHtml(opt.name) + '</h2>' +
        docsLink +
        '<p class="insight-desc">' + escapeHtml(ins.desc) + '</p>' +
        '<hr class="rule"/>' +
        '<h3>' + escapeHtml(t('pros')) + '</h3><ul class="insight-list pros">' + ins.pros.map((x) => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>' +
        '<h3>' + escapeHtml(t('cons')) + '</h3><ul class="insight-list cons">' + ins.cons.map((x) => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>' +
        '<h3>' + escapeHtml(t('when')) + '</h3><ul class="insight-list pros">' + ins.when.map((x) => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>' +
        '<h3>' + escapeHtml(t('avoid')) + '</h3><ul class="insight-list cons">' + ins.avoid.map((x) => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>' +
        '<h3>' + escapeHtml(t('with')) + '</h3><div class="works-tags">' + ins.with.map((x) => '<span class="tag">' + escapeHtml(x) + '</span>').join('') + '</div>';
    }

    function commitAndNext() {
      if (!state.selected) return;
      state.answers[decision().id] = state.selected;
      persist();
      if (state.step >= DECISIONS.length - 1) { showReview(); return; }
      state.step += 1;
      persist();
      renderAll();
    }

    function skip() {
      state.step = Math.min(state.step + 1, DECISIONS.length - 1);
      persist();
      renderAll();
    }

    function back() {
      if (state.step === 0) return;
      state.step -= 1;
      persist();
      renderAll();
    }

    function jumpTo(id) {
      const idx = DECISIONS.findIndex((d) => d.id === id);
      if (idx < 0) return;
      state.step = idx;
      state.view = 'wizard';
      persist();
      showWizard();
    }

    function showWizard() {
      state.view = 'wizard';
      document.getElementById('screen-wizard').classList.add('is-on');
      document.getElementById('screen-review').classList.remove('is-on');
      document.getElementById('btn-review').classList.remove('is-active');
      persist();
      renderAll();
    }

    function showReview() {
      state.view = 'review';
      document.getElementById('screen-wizard').classList.remove('is-on');
      document.getElementById('screen-review').classList.add('is-on');
      document.getElementById('btn-review').classList.add('is-active');
      persist();
      renderReview();
    }

    function renderReview() {
      const grid = document.getElementById('review-grid');
      grid.innerHTML = GROUPS.map((group) => {
        const lines = group.decisionIds.map((id) => {
          const dec = DECISIONS.find((d) => d.id === id);
          const opt = optionById(dec, state.answers[id]);
          if (!opt) return '<p class="review-tech">' + escapeHtml(t('undecided')) + '</p><p class="review-reason">' + escapeHtml(t('reviewPending')) + '</p>';
          const extra = opt.implies ? '<p class="review-tech">' + escapeHtml(opt.implies) + '</p>' : '';
          return '<p class="review-tech">' + escapeHtml(opt.name) + '</p>' + extra +
            '<p class="review-reason">' + escapeHtml(opt.reason) + '</p>';
        }).join('');
        return '<article class="card review-card" data-od-id="review-' + group.id + '">' +
          '<div class="row-between"><h3>' + escapeHtml(groupTitle(group)) + '</h3>' +
          '<button class="btn btn-ghost" type="button" data-jump="' + group.decisionIds[0] + '">' + escapeHtml(t('edit')) + '</button></div>' +
          lines + '</article>';
      }).join('');
      grid.querySelectorAll('[data-jump]').forEach((btn) => {
        btn.addEventListener('click', () => jumpTo(btn.getAttribute('data-jump')));
      });
    }

    function buildAgents() {
      const lines = ['# AGENTS.md', '', t('agentsIntro'), ''];
      GROUPS.forEach((group) => {
        lines.push('## ' + groupTitle(group));
        group.decisionIds.forEach((id) => {
          const dec = DECISIONS.find((d) => d.id === id);
          const opt = optionById(dec, state.answers[id]);
          if (!opt) {
            lines.push('- ' + dec.category + ': ' + t('undecided'));
            return;
          }
          lines.push('- ' + dec.category + ': **' + opt.name + '**');
          lines.push('  - ' + t('agentsReason') + ': ' + opt.reason);
          if (opt.implies) lines.push('  - ' + t('agentsWith') + ': ' + opt.implies);
        });
        lines.push('');
      });
      lines.push('## ' + t('agentsRules'));
      lines.push('- ' + t('agentsRule1'));
      lines.push('- ' + t('agentsRule2'));
      lines.push('- ' + t('agentsRule3'));
      return lines.join('\n');
    }

    function resetProject() {
      state.step = 0;
      state.answers = {};
      state.selected = null;
      state.preview = null;
      persist();
      showWizard();
    }

    function renderAll() {
      renderTree();
      renderProgress();
      renderDecision();
    }

    document.getElementById('option-list').addEventListener('mouseleave', () => {
      const dec = decision();
      const recommended = dec.options.find((o) => o.recommended);
      state.preview = state.selected || (recommended && recommended.id) || dec.options[0].id;
      syncPreview();
    });
    document.getElementById('btn-continue').addEventListener('click', commitAndNext);
    document.getElementById('btn-skip').addEventListener('click', skip);
    document.getElementById('btn-back').addEventListener('click', back);
    document.getElementById('btn-new').addEventListener('click', resetProject);
    document.getElementById('btn-review').addEventListener('click', showReview);
    document.getElementById('btn-back-decisions').addEventListener('click', showWizard);
    document.getElementById('btn-restart').addEventListener('click', resetProject);
    document.getElementById('btn-generate').addEventListener('click', () => {
      document.getElementById('agents-out').textContent = buildAgents();
      document.getElementById('agents-dialog').showModal();
    });
    document.getElementById('btn-close-dialog').addEventListener('click', () => {
      document.getElementById('agents-dialog').close();
    });
    document.getElementById('btn-copy').addEventListener('click', async () => {
      const text = document.getElementById('agents-out').textContent;
      try { await navigator.clipboard.writeText(text); document.getElementById('btn-copy').textContent = t('copied'); }
      catch (err) { document.getElementById('btn-copy').textContent = t('copySelect'); }
      setTimeout(() => { document.getElementById('btn-copy').textContent = t('copy'); }, 1600);
    });
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      if (next === 'dark') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'light');
      persist();
    });
    document.getElementById('btn-lang').addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = document.getElementById('lang-menu');
      setLangMenu(menu.hidden);
    });
    document.getElementById('lang-menu').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-lang]');
      if (!btn) return;
      state.locale = btn.getAttribute('data-lang');
      persist();
      setLangMenu(false);
      applyChrome();
      if (state.view === 'review') renderReview();
      else renderAll();
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.lang-wrap')) setLangMenu(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setLangMenu(false);
      if (state.view !== 'wizard') return;
      if (!document.getElementById('lang-menu').hidden) return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const dec = decision();
      const ids = dec.options.map((o) => o.id);
      const current = state.preview || state.selected || ids[0];
      const idx = Math.max(0, ids.indexOf(current));
      const cols = optionColumns(ids.length);
      let move = null;
      if (e.key === 'ArrowDown' || e.key === 'j') move = 'down';
      else if (e.key === 'ArrowUp' || e.key === 'k') move = 'up';
      else if (e.key === 'ArrowRight' || e.key === 'l') move = 'right';
      else if (e.key === 'ArrowLeft' || e.key === 'h') move = 'left';
      if (move) {
        e.preventDefault();
        const next = ids[moveOptionIndex(ids, idx, cols, move)];
        state.preview = next;
        syncPreview();
        const card = document.querySelector('[data-opt="' + next + '"]');
        if (card) card.focus();
      } else if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
        if (document.activeElement && document.activeElement.classList.contains('option-card')) {
          e.preventDefault();
          selectOption(document.activeElement.getAttribute('data-opt'));
        }
      } else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        commitAndNext();
      }
    });

    load();
    applyChrome();
    if (state.view === 'review') showReview();
    else renderAll();
  </script>
</body>
</html>
